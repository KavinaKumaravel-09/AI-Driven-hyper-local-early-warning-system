<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1528"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer radar ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#3B82F6" stroke-width="3" opacity="0.25"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#93C5FD" stroke-width="2" opacity="0.5"/>

  <!-- Radar sweep wedge -->
  <path d="M 256 256 L 396 116 A 198 198 0 0 0 256 58 Z" fill="#3B82F6" opacity="0.15"/>

  <!-- Shield Shape -->
  <path d="M 256 95 L 370 148 C 370 270 295 365 256 405 C 217 365 142 270 142 148 Z" fill="url(#shieldGrad)" filter="url(#glow)" opacity="0.95"/>
  <path d="M 256 110 L 355 158 C 355 264 290 350 256 385 C 222 350 157 264 157 158 Z" fill="#0E1E38"/>

  <!-- Weather & Warning Emblem inside Shield -->
  <!-- Cloud -->
  <path d="M 215 220 C 205 200 178 200 170 220 C 155 220 145 235 152 250 C 145 265 160 280 175 280 L 330 280 C 345 280 360 268 355 250 C 355 235 342 225 330 225 C 326 200 295 190 275 205 C 265 190 230 192 215 220 Z" fill="#E2E8F0" opacity="0.9"/>
  
  <!-- Lightning Bolt -->
  <path d="M 270 240 L 235 295 L 265 295 L 240 355 L 295 285 L 262 285 Z" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Pulse dots -->
  <circle cx="256" cy="256" r="6" fill="#F87171"/>
  <circle cx="330" cy="190" r="4" fill="#34D399"/>
  <circle cx="180" cy="310" r="4" fill="#FBBF24"/>
</svg>
